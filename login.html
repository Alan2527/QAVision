<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAVision — Identificación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #070707;
            color: #e8e8e8;
        }
        .font-title {
            font-family: 'Syne', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute w-[400px] h-[400px] bg-[#10b981]/5 rounded-full blur-[120px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-[#0d0d0d] border border-[#1a1a1a] rounded-3xl p-8 shadow-2xl relative z-10">
        
        <div class="text-center mb-8">
            <div class="inline-flex w-12 h-12 bg-[#10b981]/10 rounded-2xl items-center justify-center text-[#10b981] font-title font-black text-2xl italic mb-3 border border-[#10b981]/20">Q</div>
            <h1 id="auth-title" class="text-2xl font-title font-bold tracking-tight text-white">Iniciar sesión en QAVision</h1>
            <p id="auth-subtitle" class="text-xs text-[#505050] mt-1">Ingresá tus credenciales para acceder a los reportes completos</p>
        </div>

        <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border text-center"></div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="btn-google" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-[#1a1a1a] bg-[#070707] text-xs font-medium text-white hover:bg-white/5 transition-all active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                Google
            </button>
            <button id="btn-github" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-[#1a1a1a] bg-[#070707] text-xs font-medium text-white hover:bg-white/5 transition-all active:scale-95">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.48 blocks 0-.197-.007-.72-.011-1.413-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
                GitHub
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-5">
            <div class="flex-grow border-t border-[#1a1a1a]"></div>
            <span class="flex-shrink mx-4 text-[10px] uppercase font-bold tracking-widest text-[#505050]">O con correo</span>
            <div class="flex-grow border-t border-[#1a1a1a]"></div>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#505050] mb-2">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@compania.com" class="w-full bg-[#070707] border border-[#1a1a1a] rounded-xl px-4 py-3 text-sm text-white placeholder-[#505050] focus:outline-none focus:border-[#10b981] transition-all">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#505050] mb-2">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#070707] border border-[#1a1a1a] rounded-xl px-4 py-3 text-sm text-white placeholder-[#505050] focus:outline-none focus:border-[#10b981] transition-all">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-[#10b981] text-black font-bold py-3 px-4 rounded-xl text-sm hover:bg-[#0d9668] transition-all active:scale-[0.98] mt-6">
                Ingresar
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-[#1a1a1a]">
            <p class="text-xs text-[#505050]">
                <span id="toggle-text">¿No tenés una cuenta?</span>
                <button id="btn-toggle" class="text-[#10b981] font-bold hover:underline focus:outline-none ml-1">Registrate acá</button>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xdufdcwvaxvcdcjgdvvt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_TwPa9nFgtPTtYogbMcEckQ_36ZeSBpf";
        
        const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoginMode = true;

        const form = document.getElementById('auth-form');
        const title = document.getElementById('auth-title');
        const subtitle = document.getElementById('auth-subtitle');
        const btnSubmit = document.getElementById('btn-submit');
        const btnToggle = document.getElementById('btn-toggle');
        const toggleText = document.getElementById('toggle-text');
        const alertBox = document.getElementById('auth-alert');

        function showAlert(msg, type = 'error') {
            alertBox.innerText = msg;
            alertBox.className = `mb-4 p-3 rounded-xl text-xs font-medium border text-center ${
                type === 'error' 
                ? 'bg-red-500/10 text-red-500 border-red-500/20' 
                : 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20'
            }`;
            alertBox.classList.remove('hidden');
        }

        // Intercambiar pantallas entre Login y Registro
        btnToggle.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                title.innerText = "Iniciar sesión en QAVision";
                subtitle.innerText = "Ingresá tus credenciales para acceder a los reportes completos";
                btnSubmit.innerText = "Ingresar";
                toggleText.innerText = "¿No tenés una cuenta?";
                btnToggle.innerText = "Registrate acá";
            } else {
                title.innerText = "Crear una cuenta";
                subtitle.innerText = "Registrate para empezar a encapsular tus entornos de prueba";
                btnSubmit.innerText = "Crear Cuenta";
                toggleText.innerText = "¿Ya tenés cuenta?";
                btnToggle.innerText = "Iniciá sesión";
            }
            alertBox.classList.add('hidden');
            form.reset();
        });

        // Autenticación tradicional (Email / Password)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerText = isLoginMode ? "Ingresando..." : "Registrando...";
            alertBox.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLoginMode) {
                const { data, error } = await authClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showAlert(error.message, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Ingresar";
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                const { data, error } = await authClient.auth.signUp({ email, password });
                if (error) {
                    showAlert(error.message, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Crear Cuenta";
                } else {
                    showAlert("¡Registro exitoso! Si se configuró confirmación, revisá tu correo.", 'success');
                    form.reset();
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Crear Cuenta";
                }
            }
        });

        // Autenticación Social: Google
        document.getElementById('btn-google').addEventListener('click', async () => {
            const { error } = await authClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/QAVision/dashboard.html' }
            });
            if (error) showAlert(error.message, 'error');
        });

        // Autenticación Social: GitHub
        document.getElementById('btn-github').addEventListener('click', async () => {
            const { error } = await authClient.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/QAVision/dashboard.html' }
            });
            if (error) showAlert(error.message, 'error');
        });

        // Verificación de sesión activa previa
        async function verificarSesion() {
            const { data: { session } } = await authClient.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        verificarSesion();
    </script>
</body>
</html>
