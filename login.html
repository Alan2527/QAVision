<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAVision — Identificación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --surface-2: #0d0d0d;
            --border: #1a1a1a;
            --text: #e8e8e8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Noise overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
        }

        /* Grid */
        .hero-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 10%, transparent 100%);
            z-index: 0;
        }

        /* Central glow */
        .center-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse, rgba(16,185,129,0.055) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        .font-title { font-family: 'Syne', sans-serif; }
        .font-mono  { font-family: 'DM Mono', monospace; }

        /* Scan line animation on card */
        @keyframes scan {
            0%   { top: -2px; opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }
        .card-scan::after {
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(16,185,129,0.4), transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        /* Input focus glow */
        .qa-input {
            width: 100%;
            background: #070707;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #e8e8e8;
            font-family: 'DM Mono', monospace;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .qa-input::placeholder { color: #303030; }
        .qa-input:focus {
            border-color: rgba(16,185,129,0.5);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.06);
        }

        /* Social button */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            background: #070707;
            color: #e8e8e8;
            font-size: 12px;
            font-weight: 700;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: #2a2a2a;
        }
        .social-btn:active { transform: scale(0.97); }

        /* Submit button */
        .submit-btn {
            width: 100%;
            background: #10b981;
            color: #000;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 24px rgba(16,185,129,0.15);
        }
        .submit-btn:hover {
            background: #0d9668;
            box-shadow: 0 0 32px rgba(16,185,129,0.25);
            transform: translateY(-1px);
        }
        .submit-btn:active { transform: scale(0.98) translateY(0); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">
    <div class="hero-grid"></div>
    <div class="center-glow"></div>

    <!-- CARD -->
    <div class="card-scan w-full max-w-sm relative z-10 bg-[#0d0d0d] border border-[#1a1a1a] rounded-2xl overflow-hidden shadow-[0_0_80px_rgba(0,0,0,0.8)]">

        <!-- Top stripe -->
        <div class="h-px bg-gradient-to-r from-transparent via-[#10b981]/40 to-transparent"></div>

        <div class="p-8">

            <!-- Branding -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 mb-5">
                    <span class="font-title text-3xl font-black text-[#10b981] tracking-tighter italic">QAVision</span>
                    <span class="font-mono text-[9px] text-[#10b981]/50 bg-[#10b981]/10 border border-[#10b981]/20 px-1.5 py-0.5 rounded-full uppercase tracking-wider">v2.0</span>
                </div>
                <div class="h-px bg-gradient-to-r from-transparent via-[#1a1a1a] to-transparent mb-5"></div>
                <h1 id="auth-title" class="font-title text-xl font-bold tracking-tight text-white">Iniciar Sesión</h1>
                <p id="auth-subtitle" class="font-mono text-[10px] text-[#505050] mt-1.5 leading-relaxed">Ingresá tus credenciales para acceder<br>a los reportes completos</p>
            </div>

            <!-- Alert -->
            <div id="auth-alert" class="hidden mb-5 p-3 rounded-xl font-mono text-[11px] font-bold border text-center"></div>

            <!-- Social buttons -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <button id="btn-google" class="social-btn">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button id="btn-github" class="social-btn">
                    <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.48 0-.197-.007-.72-.011-1.413-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                    </svg>
                    GitHub
                </button>
            </div>

            <!-- Divider -->
            <div class="relative flex items-center mb-5">
                <div class="flex-grow border-t border-[#1a1a1a]"></div>
                <span class="mx-4 font-mono text-[9px] uppercase font-bold tracking-[0.2em] text-[#303030]">o con correo</span>
                <div class="flex-grow border-t border-[#1a1a1a]"></div>
            </div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block font-mono text-[9px] font-bold uppercase tracking-[0.2em] text-[#505050] mb-2">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@compania.com" class="qa-input">
                </div>
                <div>
                    <label class="block font-mono text-[9px] font-bold uppercase tracking-[0.2em] text-[#505050] mb-2">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" class="qa-input">
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-submit" class="submit-btn">
                        Ingresar
                    </button>
                </div>
            </form>

            <!-- Toggle -->
            <div class="text-center mt-5 pt-5 border-t border-[#1a1a1a]">
                <p class="font-mono text-[10px] text-[#505050]">
                    <span id="toggle-text">¿No tenés una cuenta?</span>
                    <button id="btn-toggle" class="text-[#10b981] font-bold hover:underline focus:outline-none ml-1">Registrate acá</button>
                </p>
            </div>

        </div>

        <!-- Bottom stripe -->
        <div class="h-px bg-gradient-to-r from-transparent via-[#1a1a1a] to-transparent"></div>
        <div class="px-8 py-3 flex justify-between items-center bg-black/30">
            <span class="font-mono text-[9px] text-[#303030] uppercase tracking-widest">Console v2.0</span>
            <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#10b981] animate-pulse"></span>
                <span class="font-mono text-[9px] text-[#303030]">Sistema activo</span>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xdufdcwvaxvcdcjgdvvt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_TwPa9nFgtPTtYogbMcEckQ_36ZeSBpf";
        const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoginMode = true;

        const form       = document.getElementById('auth-form');
        const title      = document.getElementById('auth-title');
        const subtitle   = document.getElementById('auth-subtitle');
        const btnSubmit  = document.getElementById('btn-submit');
        const btnToggle  = document.getElementById('btn-toggle');
        const toggleText = document.getElementById('toggle-text');
        const alertBox   = document.getElementById('auth-alert');

        function showAlert(msg, type = 'error') {
            alertBox.innerText = msg;
            alertBox.className = `mb-5 p-3 rounded-xl font-mono text-[11px] font-bold border text-center ${
                type === 'error'
                    ? 'bg-red-500/10 text-red-400 border-red-500/20'
                    : 'bg-[#10b981]/10 text-[#10b981] border-[#10b981]/20'
            }`;
            alertBox.classList.remove('hidden');
        }

        btnToggle.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                title.innerText      = "Iniciar Sesión";
                subtitle.innerHTML   = "Ingresá tus credenciales para acceder<br>a los reportes completos";
                btnSubmit.innerText  = "Ingresar";
                toggleText.innerText = "¿No tenés una cuenta?";
                btnToggle.innerText  = "Registrate acá";
            } else {
                title.innerText      = "Crear Cuenta";
                subtitle.innerHTML   = "Registrate para comenzar a auditar<br>tus entornos de prueba";
                btnSubmit.innerText  = "Crear Cuenta";
                toggleText.innerText = "¿Ya tenés cuenta?";
                btnToggle.innerText  = "Iniciá sesión";
            }
            alertBox.classList.add('hidden');
            form.reset();
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = isLoginMode ? "Ingresando..." : "Registrando...";
            alertBox.classList.add('hidden');

            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isLoginMode) {
                const { error } = await authClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showAlert(error.message, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Ingresar";
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                const { error } = await authClient.auth.signUp({ email, password });
                if (error) {
                    showAlert(error.message, 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Crear Cuenta";
                } else {
                    showAlert("¡Registro exitoso! Revisá tu correo si se requiere confirmación.", 'success');
                    form.reset();
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Crear Cuenta";
                }
            }
        });

        document.getElementById('btn-google').addEventListener('click', async () => {
            const { error } = await authClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/QAVision/dashboard.html' }
            });
            if (error) showAlert(error.message, 'error');
        });

        document.getElementById('btn-github').addEventListener('click', async () => {
            const { error } = await authClient.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/QAVision/dashboard.html' }
            });
            if (error) showAlert(error.message, 'error');
        });

        async function verificarSesion() {
            const { data: { session } } = await authClient.auth.getSession();
            if (session) window.location.href = '/QAVision/dashboard.html';
        }
        verificarSesion();
    </script>
</body>
</html>
