<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAVision — Mass Execution Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --surface: #070707;
            --surface-2: #0d0d0d;
            --border: #1a1a1a;
            --text: #e8e8e8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: var(--text);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
        }

        .hero-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 0%, black 20%, transparent 100%);
            z-index: 0;
        }

        .font-title { font-family: 'Syne', sans-serif; }
        .font-mono { font-family: 'DM Mono', monospace; }

        .bg-tech { 
            background-color: var(--surface-2); 
            border: 1px solid var(--border); 
            backdrop-filter: blur(10px);
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--green); }
    </style>
</head>
<body class="min-h-screen flex">
    <div class="hero-grid"></div>

    <aside class="w-20 md:w-64 bg-black border-r border-[#1a1a1a] p-6 h-screen sticky top-0 flex flex-col z-10 transition-all">
        <div class="mb-10 hidden md:block">
            <h1 class="font-title text-2xl font-black text-[#10b981] tracking-tighter italic">QAVision</h1>
            <div class="h-px bg-gradient-to-r from-[#10b981]/50 to-transparent mt-2"></div>
        </div>
        <nav class="flex-1 space-y-4">
            <a href="dashboard.html" class="flex items-center gap-3 text-xs font-bold text-gray-400 hover:text-[#10b981] transition-colors p-2 rounded-lg hover:bg-[#10b981]/10">
                <span class="font-mono text-lg">◂</span> <span class="hidden md:inline">Volver al Panel</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-12 relative z-10 overflow-y-auto">
        <header class="mb-10">
            <span class="font-mono text-[10px] text-[#10b981] uppercase tracking-[0.3em] font-bold">Omni-Suite Manager</span>
            <h2 class="font-title text-4xl mt-2 font-extrabold tracking-tight">Mass Execution <span class="text-gray-600">Explorer</span></h2>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-tech p-6 rounded-2xl">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Total Audited URLs</span>
                <span id="kpi-total" class="font-mono text-3xl font-black text-white">0</span>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-b-4 border-b-[#10b981]">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Perfect Audits</span>
                <span id="kpi-success" class="font-mono text-3xl font-black text-[#10b981]">0</span>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-b-4 border-b-red-500">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Issues Found</span>
                <span id="kpi-fails" class="font-mono text-3xl font-black text-red-500">0</span>
            </div>
        </div>

        <div class="bg-tech rounded-2xl p-6">
            <div class="flex justify-between items-center mb-6 border-b border-[#1a1a1a] pb-4">
                <h3 class="font-mono text-xs text-gray-400 uppercase tracking-widest font-bold">Lotes Recientes (Multi-Módulo)</h3>
                <span class="w-2 h-2 rounded-full bg-[#10b981] animate-pulse"></span>
            </div>
            <div id="lista-masiva" class="space-y-3">
                <p class="text-xs text-gray-500 font-mono text-center py-10">Cargando reportes del motor QA...</p>
            </div>
        </div>
    </main>

    <div id="detail-drawer" class="fixed inset-y-0 right-0 w-full md:w-[600px] bg-[#070707]/95 border-l border-[#1a1a1a] backdrop-blur-xl z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-[#1a1a1a] flex justify-between items-start bg-black/50">
            <div class="flex-1 pr-4 overflow-hidden">
                <span id="drawer-module-badge" class="font-mono text-[9px] text-[#505050] block uppercase tracking-widest mb-1">INSPECTOR //</span>
                <h4 id="drawer-url" class="font-mono text-xs font-bold text-white truncate w-full">Cargando...</h4>
            </div>
            <button onclick="cerrarDrawer()" class="text-gray-500 hover:text-white font-mono text-xs p-2 bg-[#1a1a1a] rounded-lg border border-zinc-800 transition">✕ CLOSE</button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll">
            <div class="flex items-center justify-between bg-[#0d0d0d] border border-[#1a1a1a] p-4 rounded-xl">
                <div>
                    <span class="font-mono text-[9px] text-[#505050] block mb-1">RESULTADO GLOBAL</span>
                    <span id="drawer-status" class="font-mono text-sm font-black">---</span>
                </div>
                <div class="text-right">
                    <span class="font-mono text-[9px] text-[#505050] block mb-1">TIMESTAMP</span>
                    <span id="drawer-time" class="font-mono text-[11px] text-gray-400">--:--:--</span>
                </div>
            </div>

            <div id="drawer-dynamic-content" class="space-y-6">
                </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://xdufdcwvaxvcdcjgdvvt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TwPa9nFgtPTtYogbMcEckQ_36ZeSBpf";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalData = [];

    async function init() {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const [vrt, seo, perf, links] = await Promise.all([
            sb.from('pruebas_qa').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('seo_audits').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('performance_audits').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('auditoria_links').select('*').eq('user_id', user.id).not('batch_id', 'is', null)
        ]);

        globalData = [
            ...(vrt.data || []).map(i => ({ ...i, modulo: 'vrt', url_m: i.url_a, fecha: i.creado_el })),
            ...(seo.data || []).map(i => ({ ...i, modulo: 'seo', url_m: i.url, fecha: i.created_at })),
            ...(perf.data || []).map(i => ({ ...i, modulo: 'perf', url_m: i.url, fecha: i.created_at })),
            ...(links.data || []).map(i => ({ ...i, modulo: 'links', url_m: i.url_auditada, fecha: i.created_at }))
        ].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

        renderizarLista();
    }

    function renderizarLista() {
        document.getElementById('lista-masiva').innerHTML = globalData.map(item => `
            <div onclick="verDetalle('${item.id}', '${item.modulo}')" class="bg-tech p-4 rounded-xl border border-[#1a1a1a] cursor-pointer hover:border-emerald-500/30 transition-all">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-mono text-xs text-gray-300 truncate w-48">${item.url_m}</p>
                        <span class="text-[9px] font-black uppercase text-gray-600">${item.modulo}</span>
                    </div>
                    <span class="text-[10px] font-mono text-emerald-500">${new Date(item.fecha).toLocaleDateString()}</span>
                </div>
            </div>
        `).join('');
    }

    function verDetalle(id, modulo) {
        const item = globalData.find(i => i.id == id && i.modulo === modulo);
        if (!item) return;

        const contentBox = document.getElementById('drawer-dynamic-content');
        document.getElementById('drawer-url').innerText = item.url_m;

        // ESTRUCTURA SEGÚN CADA DASHBOARD ORIGINAL
        if (modulo === 'seo') {
            contentBox.innerHTML = `
                <div class="bg-tech p-6 rounded-lg">
                    <h3 class="text-lg font-bold mb-4">SEO Checklist</h3>
                    <div id="checklist">
                        ${renderRow('Imágenes Alt', item.imgs_sin_alt > 0 ? 'Error' : 'OK', item.imgs_sin_alt > 0 ? 'error' : 'ok')}
                        ${renderRow('Inputs sin Label', item.inputs_sin_label > 0 ? 'Error' : 'OK', item.inputs_sin_label > 0 ? 'error' : 'ok')}
                        ${renderRow('Botones sin etiqueta', item.botones_sin_etiqueta > 0 ? 'Warn' : 'OK', item.botones_sin_etiqueta > 0 ? 'warn' : 'ok')}
                    </div>
                </div>`;
        } 
        else if (modulo === 'perf') {
            const score = (item.fcp_ms < 2500 && item.lcp_ms < 2500) ? 90 : 40;
            contentBox.innerHTML = `
                <div class="bg-tech p-6 rounded-lg text-center">
                    <div id="score-circle" class="w-32 h-32 rounded-full border-4 mx-auto flex flex-col items-center justify-center ${score >= 80 ? 'border-emerald-500' : 'border-red-500'}">
                        <span class="text-4xl font-black">${score}</span>
                    </div>
                    <p class="mt-4 font-black uppercase tracking-widest ${score >= 80 ? 'good' : 'poor'}">
                        ${score >= 80 ? 'Rendimiento Óptimo' : 'Rendimiento Pobre'}
                    </p>
                    <div class="mt-6 text-left space-y-2">
                        <div class="flex justify-between"><span>FCP</span><span class="font-mono ${item.fcp_ms > 2500 ? 'poor' : 'good'}">${item.fcp_ms}ms</span></div>
                        <div class="flex justify-between"><span>LCP</span><span class="font-mono ${item.lcp_ms > 2500 ? 'poor' : 'good'}">${item.lcp_ms}ms</span></div>
                    </div>
                </div>`;
        }
        else if (modulo === 'links') {
            const report = typeof item.reporte === 'string' ? JSON.parse(item.reporte || '[]') : (item.reporte || []);
            contentBox.innerHTML = `
                <table class="w-full text-left border-collapse">
                    ${report.map(r => `
                        <tr class="border-b border-[#111827]">
                            <td class="p-3 text-xs truncate max-w-[150px]">${r.url}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-[9px] font-black ${r.obstruido ? 'status-error' : 'status-ok'}">${r.obstruido ? 'OBSTRUIDO' : 'LIBRE'}</span></td>
                        </tr>
                    `).join('')}
                </table>`;
        }
        else if (modulo === 'vrt') {
            contentBox.innerHTML = `
                <div class="bg-tech p-4 rounded-lg">
                    <p class="text-xs text-gray-500 mb-2">Visual Diff Report</p>
                    <img src="${item.img_diff_url}" class="w-full rounded border border-[#1a1a1a]">
                    <div class="mt-4 flex justify-between font-black text-sm">
                        <span>Diferencias:</span>
                        <span class="${item.diferencias > 0 ? 'text-red-500' : 'text-emerald-500'}">${item.diferencias || 0}</span>
                    </div>
                </div>`;
        }

        document.getElementById('detail-drawer').classList.remove('translate-x-full');
    }

    // Funciones auxiliares para replicar clases CSS exactas
    function renderRow(label, desc, type) {
        return `<div class="check-row flex gap-4 py-3 border-b border-[#111827]">
                    <span class="badge ${type}">${type.toUpperCase()}</span>
                    <div>
                        <p class="text-sm font-bold">${label}</p>
                        <p class="text-[10px] text-gray-500">${desc}</p>
                    </div>
                </div>`;
    }

    function cerrarDrawer() {
        document.getElementById('detail-drawer').classList.add('translate-x-full');
    }

    init();
</script>
    
</body>
</html>
