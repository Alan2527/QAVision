<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAVision — Mass Execution Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --surface: #070707;
            --surface-2: #0d0d0d;
            --border: #1a1a1a;
            --text: #e8e8e8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: var(--text);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
        }

        .hero-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 0%, black 20%, transparent 100%);
            z-index: 0;
        }

        .font-title { font-family: 'Syne', sans-serif; }
        .font-mono { font-family: 'DM Mono', monospace; }

        .bg-tech { 
            background-color: var(--surface-2); 
            border: 1px solid var(--border); 
            backdrop-filter: blur(10px);
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--green); }

        /* SCROLL CUSTOM DARK */
.custom-scroll::-webkit-scrollbar {
    width: 6px;
}

.custom-scroll::-webkit-scrollbar-track {
    background: transparent;
}

.custom-scroll::-webkit-scrollbar-thumb {
    background-color: #3f3f46; /* zinc-700 */
    border-radius: 10px;
}

.custom-scroll::-webkit-scrollbar-thumb:hover {
    background-color: #52525b; /* zinc-600 */
}
    </style>
</head>
<body class="min-h-screen flex">
    <div class="hero-grid"></div>

    <aside class="w-20 md:w-64 bg-black border-r border-[#1a1a1a] p-6 h-screen sticky top-0 flex flex-col z-10 transition-all">
        <div class="mb-10 hidden md:block">
            <h1 class="font-title text-2xl font-black text-[#10b981] tracking-tighter italic">QAVision</h1>
            <div class="h-px bg-gradient-to-r from-[#10b981]/50 to-transparent mt-2"></div>
        </div>
        <nav class="flex-1 space-y-4">
            <a href="dashboard.html" class="flex items-center gap-3 text-xs font-bold text-gray-400 hover:text-[#10b981] transition-colors p-2 rounded-lg hover:bg-[#10b981]/10">
                <span class="font-mono text-lg">◂</span> <span class="hidden md:inline">Volver al Panel</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-12 relative z-10 overflow-y-auto">
        <header class="mb-10">
            <span class="font-mono text-[10px] text-[#10b981] uppercase tracking-[0.3em] font-bold">Omni-Suite Manager</span>
            <h2 class="font-title text-4xl mt-2 font-extrabold tracking-tight">Mass Execution <span class="text-gray-600">Explorer</span></h2>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-tech p-6 rounded-2xl">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Total Audited URLs</span>
                <span id="kpi-total" class="font-mono text-3xl font-black text-white">0</span>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-b-4 border-b-[#10b981]">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Perfect Audits</span>
                <span id="kpi-success" class="font-mono text-3xl font-black text-[#10b981]">0</span>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-b-4 border-b-red-500">
                <span class="font-mono text-[10px] text-gray-500 block mb-2 uppercase tracking-widest">Issues Found</span>
                <span id="kpi-fails" class="font-mono text-3xl font-black text-red-500">0</span>
            </div>
        </div>

        <div class="bg-tech rounded-2xl p-6">
            <div class="flex justify-between items-center mb-6 border-b border-[#1a1a1a] pb-4">
                <h3 class="font-mono text-xs text-gray-400 uppercase tracking-widest font-bold">Lotes Recientes (Multi-Módulo)</h3>
                <span class="w-2 h-2 rounded-full bg-[#10b981] animate-pulse"></span>
            </div>
            <div id="lista-masiva" class="space-y-3">
                <p class="text-xs text-gray-500 font-mono text-center py-10">Cargando reportes del motor QA...</p>
            </div>
        </div>
    </main>

    <div id="detail-drawer" class="fixed inset-y-0 right-0 w-full md:w-[600px] bg-[#070707]/95 border-l border-[#1a1a1a] backdrop-blur-xl z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-[#1a1a1a] flex justify-between items-start bg-black/50">
            <div class="flex-1 pr-4 overflow-hidden">
                <span id="drawer-module-badge" class="font-mono text-[9px] text-[#505050] block uppercase tracking-widest mb-1">INSPECTOR //</span>
                <h4 id="drawer-url" class="font-mono text-xs font-bold text-white truncate w-full">Cargando...</h4>
            </div>
            <button onclick="cerrarDrawer()" class="text-gray-500 hover:text-white font-mono text-xs p-2 bg-[#1a1a1a] rounded-lg border border-zinc-800 transition">✕ CLOSE</button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scroll">
            <div class="flex items-center justify-between bg-[#0d0d0d] border border-[#1a1a1a] p-4 rounded-xl">
                <div>
                    <span class="font-mono text-[9px] text-[#505050] block mb-1">RESULTADO GLOBAL</span>
                    <span id="drawer-status" class="font-mono text-sm font-black">---</span>
                </div>
                <div class="text-right">
                    <span class="font-mono text-[9px] text-[#505050] block mb-1">TIMESTAMP</span>
                    <span id="drawer-time" class="font-mono text-[11px] text-gray-400">--:--:--</span>
                </div>
            </div>

            <div id="drawer-dynamic-content" class="space-y-6">
                </div>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://xdufdcwvaxvcdcjgdvvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_TwPa9nFgtPTtYogbMcEckQ_36ZeSBpf";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const M_STYLES = {
    vrt:   { color: 'text-purple-400', bg: 'bg-purple-500/10' },
    seo:   { color: 'text-blue-400', bg: 'bg-blue-500/10' },
    perf:  { color: 'text-orange-400', bg: 'bg-orange-500/10' },
    links: { color: 'text-pink-400', bg: 'bg-pink-500/10' }
};

let globalData = [];

/* ================= INIT ================= */
async function init() {
    try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const [vrt, seo, perf, links] = await Promise.all([
            sb.from('pruebas_qa').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('seo_audits').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('performance_audits').select('*').eq('user_id', user.id).not('batch_id', 'is', null),
            sb.from('auditoria_links').select('*').eq('user_id', user.id).not('batch_id', 'is', null)
        ]);

        globalData = [
            ...(vrt.data || []).map(i => ({ ...i, modulo: 'vrt', url_m: i.url_a, fecha: i.creado_el, errores: i.diferencias || 0 })),
            ...(seo.data || []).map(i => ({ ...i, modulo: 'seo', url_m: i.url, fecha: i.created_at, errores: 0 })),
            ...(perf.data || []).map(i => ({ ...i, modulo: 'perf', url_m: i.url, fecha: i.created_at, errores: i.fcp_ms > 3000 ? 1 : 0 })),
            ...(links.data || []).map(i => ({
                ...i,
                modulo: 'links',
                url_m: i.url_auditada,
                fecha: i.created_at,
                errores: (Array.isArray(i.reporte) ? i.reporte.filter(r=>r.obstruido).length : 0)
            }))
        ].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

        renderizarLista();
        actualizarKPIs();

    } catch (e) {
        console.error(e);
    }
}

/* ================= KPIs ================= */
function actualizarKPIs() {
    const total = globalData.length;
    const fails = globalData.filter(i => i.errores > 0).length;
    const success = total - fails;

    document.getElementById('kpi-total').innerText = total;
    document.getElementById('kpi-success').innerText = success;
    document.getElementById('kpi-fails').innerText = fails;
}

/* ================= LISTA ================= */
function renderizarLista() {
    const cont = document.getElementById('lista-masiva');

    cont.innerHTML = globalData.map(item => {
        const s = M_STYLES[item.modulo];
        return `
            <div class="flex items-center justify-between p-4 bg-[#0d0d0d] border border-[#1a1a1a] rounded-xl">
                <div class="flex items-center gap-4">
                    <div class="w-1.5 h-10 rounded-full ${s.bg.replace('/10','/50')}"></div>
                    <div>
                        <p class="font-mono text-xs text-gray-300">${item.url_m}</p>
                        <span class="text-[9px] font-bold ${s.color} uppercase">${item.modulo}</span>
                    </div>
                </div>
                <button onclick="verDetalle('${item.id}', '${item.modulo}')" 
                    class="text-xs px-3 py-1 bg-zinc-800 rounded">
                    INSPECT
                </button>
            </div>
        `;
    }).join('');
}

/* ================= DETALLE ================= */
function verDetalle(id, modulo) {
    const item = globalData.find(i => i.id == id && i.modulo === modulo);
    if (!item) return;

    document.getElementById('drawer-url').innerText = item.url_m;
    document.getElementById('drawer-time').innerText = new Date(item.fecha).toLocaleString();

    const statusEl = document.getElementById('drawer-status');
    statusEl.innerText = item.errores > 0 ? "ERROR" : "OK";
    statusEl.className = item.errores > 0 ? "text-red-500" : "text-green-500";

    let html = "";

    if (modulo === 'seo') html = renderSEO(item);
    if (modulo === 'perf') html = renderPERF(item);
    if (modulo === 'links') html = renderLINKS(item);
    if (modulo === 'vrt') html = renderVRT(item);

    document.getElementById('drawer-dynamic-content').innerHTML = html;
    document.getElementById('detail-drawer').classList.remove('translate-x-full');
}

/* ================= SEO ================= */
function renderSEO(item) {
    let ok=0,warn=0,error=0;

    function b(t){return t==='ok'?'text-green-400 bg-green-500/10':t==='warn'?'text-yellow-400 bg-yellow-500/10':'text-red-400 bg-red-500/10'}
    function l(t){return t==='ok'?'OK':t==='warn'?'ADVERTENCIA':'ERROR'}

    function check(t,title,detail){
        if(t==='ok')ok++; else if(t==='warn')warn++; else error++;
        return `<div class="py-4 border-b border-zinc-800">
            <div class="flex gap-3 mb-1">
                <span class="text-[10px] font-black px-2 py-1 rounded ${b(t)}">${l(t)}</span>
                <span class="font-bold">${title}</span>
            </div>
            <div class="text-xs text-gray-500 font-mono ml-1">${detail}</div>
        </div>`;
    }

    let html="";
    html+=`<div class="text-xs text-gray-500 mt-4">Title & Meta</div>`;
    html+=check((item.title_len>=30&&item.title_len<=60)?'ok':'warn',"Title",`${item.title_len||0} caracteres`);
    html+=check((item.meta_desc_len>=70&&item.meta_desc_len<=160)?'ok':'warn',"Meta Description",`${item.meta_desc_len||0} caracteres`);

    html+=`<div class="text-xs text-gray-500 mt-6">Estructura</div>`;
    html+=check(item.h1_count===1?'ok':'error',"H1",item.h1_count?`${item.h1_count} encontrados`:"No encontrado");

    html+=`<div class="text-xs text-gray-500 mt-6">Indexación</div>`;
    html+=check(item.canonical?'ok':'warn',"Canonical",item.canonical||"No definido");
    html+=check(item.meta_robots?'ok':'warn',"Meta Robots",item.meta_robots||"No definido");

    return `
    <div>
        <div class="grid grid-cols-3 gap-4 mb-6 text-center">
            <div class="bg-tech p-4 rounded-xl"><h2 class="text-green-400 text-2xl">${ok}</h2></div>
            <div class="bg-tech p-4 rounded-xl"><h2 class="text-yellow-400 text-2xl">${warn}</h2></div>
            <div class="bg-tech p-4 rounded-xl"><h2 class="text-red-400 text-2xl">${error}</h2></div>
        </div>
        <div class="bg-tech p-6 rounded-2xl">${html}</div>
    </div>`;
}

/* ================= PERF ================= */
function renderPERF(item) {

    function c(t,v){
        if(t==='lcp') return v<=2500?'good':v<=4000?'warn':'poor';
        if(t==='fcp') return v<=1800?'good':v<=3000?'warn':'poor';
        if(t==='cls') return v<=0.1?'good':v<=0.25?'warn':'poor';
        if(t==='tti') return v<=3800?'good':v<=7300?'warn':'poor';
        if(t==='carga') return v<=3000?'good':v<=6000?'warn':'poor';
        if(t==='peso') return v<=1?'good':v<=3?'warn':'poor';
    }

    function card(n,v,t,s){
        if(v==null)return `<div class="bg-tech p-4 rounded-xl">N/D</div>`;
        const cl=c(t,v);
        const pct=cl==='good'?100:cl==='warn'?60:30;
        const col=cl==='good'?'green':cl==='warn'?'yellow':'red';

        return `<div class="p-4 rounded-xl border border-${col}-500/30">
            <p class="text-xs text-gray-500">${n}</p>
            <p class="text-2xl font-black">${s==='ms'?(v/1000).toFixed(2)+'s':v+s}</p>
            <div class="h-1 bg-zinc-800"><div style="width:${pct}%" class="h-1 bg-${col}-400"></div></div>
        </div>`;
    }

    return `
    <div>
        <div class="text-center mb-6">
            <div class="w-24 h-24 border-4 border-green-500 rounded-full flex items-center justify-center mx-auto">
                <span class="text-3xl font-black">90</span>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            ${card('LCP',item.lcp_ms,'lcp','ms')}
            ${card('FCP',item.fcp_ms,'fcp','ms')}
            ${card('CLS',item.cls,'cls','')}
            ${card('TTI',item.tti_ms,'tti','ms')}
            ${card('Carga',item.tiempo_carga_ms,'carga','ms')}
            ${card('Peso',item.peso_mb,'peso',' MB')}
        </div>
    </div>`;
}

/* ================= LINKS ================= */
function renderLINKS(item){

    function getLabel(r){
        if(r.texto && r.texto.trim() !== '') return r.texto;
        if(r.aria_label) return `[aria] ${r.aria_label}`;
        if(r.id) return `#${r.id}`;
        if(r.class) return `.${r.class}`;
        if(r.tag) return `<${r.tag}>`;
        return 'elemento sin identificar';
    }

    function shortUrl(url){
        if(!url) return '-';
        return url.length > 50 ? url.substring(0,50) + '...' : url;
    }

    const total = item.reporte?.length || 0;
    const errores = item.reporte?.filter(r => r.obstruido).length || 0;

    return `
    <div class="space-y-4">

        <!-- RESULTADO GLOBAL -->
        <div class="flex justify-between items-center p-3 border border-zinc-800 rounded-xl">
            <div>
                <div class="text-sm text-gray-400">RESULTADO GLOBAL</div>
                <div class="text-xs ${errores>0?'text-red-400':'text-green-400'}">
                    ${errores>0?'ERROR':'OK'}
                </div>
            </div>
            <div class="text-lg font-bold ${errores>0?'text-red-400':'text-green-400'}">
                ${errores} / ${total}
            </div>
        </div>

        <!-- SCROLL -->
        <div class="max-h-[400px] overflow-y-auto pr-1 custom-scroll">

            ${(item.reporte || []).map(r => {

                const label = getLabel(r);
                const fullUrl = r.href || r.url || '-';
                const short = shortUrl(fullUrl);

                return `
                <div class="flex justify-between items-start border-b border-zinc-800 py-3 text-xs">

                    <div class="max-w-[75%]">
                        <div class="font-bold text-gray-200 mb-1">
                            ${label}
                        </div>

                        <div class="text-gray-500 truncate"
                             title="${fullUrl}">
                            ${short}
                        </div>
                    </div>

                    <div class="ml-3 ${r.obstruido?'text-red-500':'text-green-500'} font-semibold">
                        ${r.obstruido?'OBSTRUIDO':'OK'}
                    </div>

                </div>
                `;
            }).join('')}

        </div>

    </div>
    `;
}

/* ================= VRT ================= */
function renderVRT(item){

    const errores = item.diferencias || 0;
    const id = "vrt-" + Math.random().toString(36).substring(2,7);

    return `
    <div class="space-y-4 max-h-[500px] overflow-y-auto pr-1 custom-scroll">

        <!-- RESUMEN -->
        <div class="flex justify-between items-center p-3 border border-zinc-800 rounded-xl">
            <div>
                <div class="text-sm text-gray-400">Diferencias detectadas</div>
                <div class="text-xs ${errores>0?'text-red-400':'text-green-400'}">
                    ${errores>0?'ERROR':'OK'}
                </div>
            </div>
            <div class="text-lg font-bold ${errores>0?'text-red-400':'text-green-400'}">
                ${errores}
            </div>
        </div>

        <!-- DIFF -->
        <div>
            <div class="text-xs text-red-400 mb-1">DIFF</div>
            <img src="${item.img_diff_url || ''}" 
                 onclick="openImageModal('${item.img_diff_url}')"
                 class="rounded border border-red-500 w-full cursor-zoom-in">
        </div>

        <!-- ORIGINALES -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <div class="text-xs text-gray-400 mb-1">BASELINE</div>
                <img src="${item.img_a_url || ''}" 
                     onclick="openImageModal('${item.img_a_url}')"
                     class="rounded border border-zinc-800 cursor-zoom-in">
            </div>

            <div>
                <div class="text-xs text-gray-400 mb-1">ACTUAL</div>
                <img src="${item.img_b_url || ''}" 
                     onclick="openImageModal('${item.img_b_url}')"
                     class="rounded border border-zinc-800 cursor-zoom-in">
            </div>
        </div>

        <!-- COMPARADOR COLAPSADO -->
        <div class="border border-zinc-800 rounded-xl overflow-hidden">
            
            <div onclick="toggleVRT('${id}')"
                 class="cursor-pointer flex justify-between items-center p-3 bg-zinc-900 hover:bg-zinc-800 transition">
                <span class="text-xs text-gray-300">Comparador interactivo</span>
                <span id="${id}-icon" class="text-xs text-gray-500">▼</span>
            </div>

            <div id="${id}" class="hidden p-3">

                <div class="relative w-full overflow-hidden rounded-xl border border-zinc-800">
                    
                    <img src="${item.img_a_url || ''}" class="w-full block">

                    <div id="${id}-overlay" 
                         class="absolute top-0 left-0 h-full overflow-hidden" 
                         style="width:50%">
                        <img src="${item.img_b_url || ''}" class="w-full block">
                    </div>

                    <input type="range" min="0" max="100" value="50"
                        class="absolute bottom-2 left-1/2 -translate-x-1/2 w-2/3"
                        oninput="document.getElementById('${id}-overlay').style.width = this.value + '%'"
                    >
                </div>

            </div>
        </div>

    </div>`;
}
function openImageModal(src){
    const modal = document.getElementById('img-modal');
    const img = document.getElementById('img-modal-src');

    img.src = src;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('img-modal');

    if (modal) {
        modal.addEventListener('click', function(){
            this.classList.add('hidden');
            this.classList.remove('flex');
        });
    }
});
function toggleVRT(id){
    const el = document.getElementById(id);
    const icon = document.getElementById(id + '-icon');

    if(el.classList.contains('hidden')){
        el.classList.remove('hidden');
        icon.innerText = '▲';
    } else {
        el.classList.add('hidden');
        icon.innerText = '▼';
    }
}
function cerrarDrawer(){
    document.getElementById('detail-drawer').classList.add('translate-x-full');
}

init();
</script>
<div id="img-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
    <img id="img-modal-src" class="max-w-[90%] max-h-[90%] rounded">
</div>    
</body>
</html>
