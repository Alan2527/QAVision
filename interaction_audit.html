<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAVision - Interaction Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; margin: 0; }
        .bg-tech { background-color: #050505; border: 1px solid #111827; }
        .status-ok { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .status-error { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        /* Tooltip motivo obstrucción */
        .motivo-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            border: 1px solid #374151;
            color: #f9fafb;
            font-size: 10px;
            font-family: monospace;
            padding: 6px 10px;
            border-radius: 8px;
            white-space: nowrap;
            z-index: 50;
            max-width: 320px;
            white-space: normal;
            text-align: left;
        }
        .motivo-wrap { position: relative; display: inline-block; }
        .motivo-wrap:hover .motivo-tooltip { display: block; }
    </style>
</head>
<body class="p-8">

    <header class="max-w-7xl mx-auto flex justify-between items-center mb-12">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-[#10b981] rounded-xl flex items-center justify-center text-black font-black italic text-xl">Q</div>
            <h1 class="text-2xl font-black tracking-tighter italic text-[#10b981]">QAVision</h1>
        </div>
        <a href="index.html" class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-white transition">← Volver al Panel</a>
    </header>

    <main class="max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 text-center">
            <div class="bg-tech p-6 rounded-2xl">
                <p class="text-[10px] font-black text-gray-500 uppercase mb-2">Total Elementos</p>
                <h2 id="stat-total" class="text-4xl font-black tracking-tighter italic">-</h2>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-red-900/30">
                <p class="text-[10px] font-black text-red-500 uppercase mb-2">Obstruidos</p>
                <h2 id="stat-obstruidos" class="text-4xl font-black tracking-tighter italic text-red-500">-</h2>
            </div>
            <div class="bg-tech p-6 rounded-2xl border-emerald-900/30">
                <p class="text-[10px] font-black text-[#10b981] uppercase mb-2">Saludables</p>
                <h2 id="stat-ok" class="text-4xl font-black tracking-tighter italic text-[#10b981]">-</h2>
            </div>
        </div>

        <div class="bg-tech rounded-[2rem] overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-[#0a0a0a] border-b border-gray-900">
                    <tr>
                        <th class="p-6 text-[10px] font-black uppercase text-gray-500">Texto / Etiqueta</th>
                        <th class="p-6 text-[10px] font-black uppercase text-gray-500 text-center">Tag</th>
                        <th class="p-6 text-[10px] font-black uppercase text-gray-500">URL / Destino</th>
                        <th class="p-6 text-[10px] font-black uppercase text-gray-500 text-center">Interacción</th>
                    </tr>
                </thead>
                <tbody id="lista-elementos"></tbody>
            </table>
        </div>
    </main>

<script>
    const SB_URL = "https://xdufdcwvaxvcdcjgdvvt.supabase.co";
    const SB_KEY = "sb_publishable_TwPa9nFgtPTtYogbMcEckQ_36ZeSBpf";
    const qaClient = supabase.createClient(SB_URL, SB_KEY);

    async function init() {
        const { data: { user } } = await qaClient.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const shouldTrigger = sessionStorage.getItem('qavision_trigger_test') === 'true';

        if (shouldTrigger) {
            const url = sessionStorage.getItem('qavision_last_prod');

            sessionStorage.removeItem('qavision_last_prod');
            sessionStorage.removeItem('qavision_last_stage');
            sessionStorage.removeItem('qavision_trigger_test');
            sessionStorage.removeItem('qavision_user_id');

            try {
                const response = await fetch('https://qavision-qavision-engine.hf.space/api/auditar-links', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, user_id: user.id })
                });
                if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
                await new Promise(resolve => setTimeout(resolve, 2000));
            } catch (error) {
                console.error('Error:', error.message);
            }
        }

        await cargarReporte(user.id);
    }

    async function cargarReporte(userId) {
        const { data, error } = await qaClient
            .from('auditoria_links')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: false })
            .limit(1);

        if (error || !data.length) {
            console.error("Error o sin datos:", error);
            return;
        }

        const reporte = data[0].reporte;
        const tabla = document.getElementById('lista-elementos');
        let obs = 0;

        tabla.innerHTML = '';
        reporte.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-900/50 hover:bg-white/5 transition-colors";
            if (item.obstruido) obs++;

            const esSinEtiqueta = !item.texto || item.texto.startsWith('[');
            const textoHTML = esSinEtiqueta
                ? `<span class="text-xs font-mono text-gray-600 italic">${item.texto || '[sin etiqueta]'}</span>`
                : `<span class="text-sm font-bold">${item.texto}</span>`;

            let interaccionHTML;
            if (item.nota) {
                interaccionHTML = `
                    <div class="motivo-wrap">
                        <span class="text-[10px] font-black px-3 py-1 rounded-full cursor-help"
                            style="color:#f59e0b;background:rgba(245,158,11,0.1)">
                            N/A ⓘ
                        </span>
                        <div class="motivo-tooltip">
                            <span class="font-black block mb-1" style="color:#f59e0b">Nota:</span>
                            ${item.nota}
                        </div>
                    </div>`;
            } else if (item.obstruido) {
                const motivo = item.motivo_obstruccion || 'Motivo no disponible';
                interaccionHTML = `
                    <div class="motivo-wrap">
                        <span class="text-[10px] font-black px-3 py-1 rounded-full status-error cursor-help">
                            OBSTRUIDO ⓘ
                        </span>
                        <div class="motivo-tooltip">
                            <span class="text-red-400 font-black block mb-1">Motivo:</span>
                            ${motivo}
                        </div>
                    </div>`;
            } else {
                interaccionHTML = `<span class="text-[10px] font-black px-3 py-1 rounded-full status-ok">LIBRE</span>`;
            }

            tr.innerHTML = `
                <td class="p-6">${textoHTML}</td>
                <td class="p-6 text-center">
                    <span class="text-[9px] font-black px-2 py-1 rounded bg-gray-900 text-gray-400 uppercase">
                        ${item.tipo || 'tag'}
                    </span>
                </td>
                <td class="p-6">
                    <span class="text-xs font-mono text-gray-500 truncate block max-w-xs">
                        ${item.href || item.url || '-'}
                    </span>
                </td>
                <td class="p-6 text-center">${interaccionHTML}</td>
            `;
            tabla.appendChild(tr);
        });

        document.getElementById('stat-total').innerText = reporte.length;
        document.getElementById('stat-obstruidos').innerText = obs;
        document.getElementById('stat-ok').innerText = reporte.length - obs;
    }

    init();
</script>
    
</body>
</html>
